<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="70%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </radialGradient>
    <linearGradient id="navyMedal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#125A9B" />
      <stop offset="100%" stop-color="#0C2B4E" />
    </linearGradient>
  </defs>
  
  <!-- 12 Radiant Rays of Muhammadiyah Surya -->
  <g id="rays" fill="url(#sunGlow)">
    <!-- Ray 0 -->
    <polygon points="50,2 47,30 53,30" />
    <!-- Ray 1 (30 deg) -->
    <polygon points="50,2 47,30 53,30" transform="rotate(30 50 50)" />
    <!-- Ray 2 (60 deg) -->
    <polygon points="50,2 47,30 53,30" transform="rotate(60 50 50)" />
    <!-- Ray 3 (90 deg) -->
    <polygon points="50,2 47,30 53,30" transform="rotate(90 50 50)" />
    <!-- Ray 4 (120 deg) -->
    <polygon points="50,2 47,30 53,30" transform="rotate(120 50 50)" />
    <!-- Ray 5 (150 deg) -->
    <polygon points="50,2 47,30 53,30" transform="rotate(150 50 50)" />
    <!-- Ray 6 (180 deg) -->
    <polygon points="50,2 47,30 53,30" transform="rotate(180 50 50)" />
    <!-- Ray 7 (210 deg) -->
    <polygon points="50,2 47,30 53,30" transform="rotate(210 50 50)" />
    <!-- Ray 8 (240 deg) -->
    <polygon points="50,2 47,30 53,30" transform="rotate(240 50 50)" />
    <!-- Ray 9 (270 deg) -->
    <polygon points="50,2 47,30 53,30" transform="rotate(270 50 50)" />
    <!-- Ray 10 (300 deg) -->
    <polygon points="50,2 47,30 53,30" transform="rotate(300 50 50)" />
    <!-- Ray 11 (330 deg) -->
    <polygon points="50,2 47,30 53,30" transform="rotate(330 50 50)" />
  </g>

  <!-- Outer Ring Gold -->
  <circle cx="50" cy="50" r="26" fill="#F59E0B" />
  <circle cx="50" cy="50" r="24" fill="url(#navyMedal)" stroke="#FDE68A" stroke-width="1.5" />

  <!-- Inner Circle Calligraphy Representation -->
  <circle cx="50" cy="50" r="18" fill="none" stroke="#FDE68A" stroke-width="0.8" stroke-dasharray="2 1.5" />
  
  <!-- Arabic Stylized Inscription 'Muhammadiyah' -->
  <text x="50" y="47" font-family="'Amiri', 'Traditional Arabic', serif" font-size="7.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">مُحَمَّدِيَّة</text>
  <text x="50" y="55" font-family="'Inter', sans-serif" font-size="3.2" font-weight="700" letter-spacing="1.2" fill="#FDE68A" text-anchor="middle">AL-ISHLAH</text>
  <text x="50" y="60" font-family="'Inter', sans-serif" font-size="2.4" font-weight="600" letter-spacing="0.8" fill="#E2E8F0" text-anchor="middle">SIDOWUNGU</text>
</svg>
